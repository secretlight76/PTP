name: Deploy to Cloudflare Pages (Production Only)

on:
  push:
    branches:
      - main
      - master
      - claude/improve-ptp-educational-tool-01Ah5W4e2tSBx4y7oXtUpqrP

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Publish to Cloudflare Pages (Production)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: simulateur-ptp
          directory: public
          branch: main
          # Production deployment only - no previews
          wranglerVersion: '3'
