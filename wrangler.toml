name = "simulateur-ptp"
compatibility_date = "2024-01-01"

# Configuration pour Cloudflare Pages
pages_build_output_dir = "public"

# Production uniquement - pas de previews
[env.production]
name = "simulateur-ptp-production"
route = { pattern = "simulateur-ptp.pages.dev", custom_domain = false }

# Variables d'environnement
[vars]
ENVIRONMENT = "production"
NODE_VERSION = "22.21.1"

